<!doctype html>
<html lang="uk"><head><meta charset="utf-8">
<title>ANDRE TAN — обкладинка Highlight</title>
<!-- Обкладинка Highlight 1080×1080 (як аватарки): highlight.html?<фон>~<текст>, напр. highlight.html?blush~Black%20Friday (фон: black, white, beige, blush, mint)
     Той самий вигляд, що й шаблони Highlight у дизайн-системі (класи hl-cover, hl--*, шрифт і розмір — з теми). -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Manrope:ital,wght@0,300..800;1,300..800&display=block" rel="stylesheet">
<link rel="stylesheet" href="../tokens.css">
<link rel="stylesheet" href="../theme.css">
<link rel="stylesheet" href="../components.css">
<style>
  html,body{margin:0;width:1080px;height:1080px;overflow:hidden}
  .canvas.hl-sq{width:1080px;height:1080px}
  .hl-cover__title{white-space:nowrap}
</style></head>
<body>
<div class="canvas hl-sq hl-cover" id="c"><span class="hl-cover__title" id="t"></span><span class="hl-cover__rule"></span></div>
<script>
  const [bg, txt] = decodeURIComponent(location.search.slice(1)).split('~'); // «~», бо «&» ламає запуск Edge у Windows
  document.getElementById('c').classList.add('hl--' + (bg || 'black'));
  document.getElementById('t').textContent = txt || 'New';
  // довгий текст зменшуємо, щоб він вмістився в коло профілю (≈ 78% ширини)
  document.fonts.ready.then(() => {
    const t = document.getElementById('t'), w = t.getBoundingClientRect().width;
    if (w > 840) t.style.fontSize = (parseFloat(getComputedStyle(t).fontSize) * 840 / w) + 'px';
  });
</script>
</body></html>
