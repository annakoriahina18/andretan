<div class="canvas c-story bg-black" data-name="Story / Editorial Split · Жакет у клітинку">

  <div class="price price--light" style="position:absolute;left:600px;right:var(--at-margin-story);top:1392px"><div class="price__row"><span class="price__value">7 999 ₴</span></div></div>
